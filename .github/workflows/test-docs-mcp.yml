name: Test - Docs MCP

on:
  pull_request:
    branches: [main]
    paths:
      - 'stacks/docs-mcp/**'
      - '.github/workflows/test-docs-mcp.yml'
      - '.github/workflows/_reusable-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pipeline
    uses: ./.github/workflows/_reusable-test.yml
    with:
      stack_dir: stacks/docs-mcp
      test_port: '6280'
      test_path: '/'
