name: Reusable Stack Pipeline

on:
  workflow_call:
    inputs:
      stack_dir:
        description: "Relative path to stack directory (e.g. stacks/docs-mcp)"
        required: true
        type: string
      coolify_resource_uuid:
        description: "Coolify resource UUID to deploy"
        required: true
        type: string
      environment:
        description: "GitHub environment for deployment tracking"
        required: false
        type: string
        default: "production"
      test_port:
        description: "Container port exposed by test override to poll for readiness (optional)"
        required: false
        type: string
        default: ""
      test_path:
        description: "Path to curl during smoke test"
        required: false
        type: string
        default: "/"
    secrets:
      COOLIFY_BASE_URL:
        description: "Base URL of the Coolify instance (stored as a secret to protect private domain)"
        required: true
      COOLIFY_API_TOKEN:
        description: "Coolify API Bearer Token"
        required: true

jobs:
  validate-and-test:
    name: Validate & Test (${{ inputs.stack_dir }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose syntax
        run: |
          echo "Validating ${{ inputs.stack_dir }}/docker-compose.yaml..."
          docker compose -f "${{ inputs.stack_dir }}/docker-compose.yaml" config -q

      - name: Run Smoke Test
        if: inputs.test_port != ''
        run: |
          cd "${{ inputs.stack_dir }}"
          if [ -f "docker-compose.test.yaml" ]; then
            COMPOSE_FILES="-f docker-compose.yaml -f docker-compose.test.yaml"
          else
            COMPOSE_FILES="-f docker-compose.yaml"
          fi

          echo "Starting containers with ${COMPOSE_FILES}..."
          docker compose ${COMPOSE_FILES} up -d

          echo "Polling http://localhost:${{ inputs.test_port }}${{ inputs.test_path }} for readiness..."
          SUCCESS=0
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${{ inputs.test_port }}${{ inputs.test_path }}" > /dev/null 2>&1; then
              echo "Smoke test passed after ${i} attempts!"
              SUCCESS=1
              break
            fi
            sleep 2
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "Service failed to become healthy within 60 seconds."
            docker compose ${COMPOSE_FILES} logs
            docker compose ${COMPOSE_FILES} down -v
            exit 1
          fi

          docker compose ${COMPOSE_FILES} down -v

  deploy:
    name: Deploy to Coolify (${{ inputs.environment }})
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Trigger Coolify Deployment
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          RESOURCE_UUID: ${{ inputs.coolify_resource_uuid }}
        run: |
          if [ -z "$COOLIFY_BASE_URL" ]; then
            echo "::error::COOLIFY_BASE_URL secret is not configured."
            exit 1
          fi
          if [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "::error::COOLIFY_API_TOKEN secret is not configured."
            exit 1
          fi
          if [ -z "$RESOURCE_UUID" ] || [ "$RESOURCE_UUID" = "REPLACE_WITH_DOCS_MCP_UUID" ]; then
            echo "::error::coolify_resource_uuid is not configured in the workflow."
            exit 1
          fi

          # Strip any trailing slash from base URL
          CLEAN_BASE_URL="${COOLIFY_BASE_URL%/}"
          DEPLOY_URL="${CLEAN_BASE_URL}/api/v1/deploy?uuid=${RESOURCE_UUID}"

          echo "Triggering Coolify deployment for resource UUID: ${RESOURCE_UUID}..."
          # State-changing API endpoints in Coolify >= 4.2.0 reject GET with 405. -X POST is mandatory.
          RESPONSE=$(curl -fsS -X POST \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$DEPLOY_URL")

          echo "Coolify response: $RESPONSE"
          echo "Deployment successfully queued in Coolify."
