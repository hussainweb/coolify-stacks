name: "Deploy Stack"
description: "Trigger deployment of a stack to Coolify"

inputs:
  coolify_base_url:
    description: "Base URL of the Coolify instance"
    required: true
  coolify_api_token:
    description: "Coolify API Bearer Token"
    required: true
  coolify_resource_uuid:
    description: "Coolify resource UUID to deploy"
    required: true

runs:
  using: "composite"
  steps:
    - name: Trigger Coolify Deployment
      shell: bash
      run: |
        if [ -z "${{ inputs.coolify_base_url }}" ]; then
          echo "::error::coolify_base_url is not configured."
          exit 1
        fi
        if [ -z "${{ inputs.coolify_api_token }}" ]; then
          echo "::error::coolify_api_token is not configured."
          exit 1
        fi
        if [ -z "${{ inputs.coolify_resource_uuid }}" ] || [[ "${{ inputs.coolify_resource_uuid }}" =~ ^REPLACE_WITH_ ]]; then
          echo "::error::coolify_resource_uuid is not configured in the workflow."
          exit 1
        fi

        CLEAN_BASE_URL="${{ inputs.coolify_base_url }}"
        CLEAN_BASE_URL="${CLEAN_BASE_URL%/}"
        DEPLOY_URL="${CLEAN_BASE_URL}/api/v1/deploy?uuid=${{ inputs.coolify_resource_uuid }}"

        echo "Triggering Coolify deployment for resource UUID: ${{ inputs.coolify_resource_uuid }}..."
        RESPONSE=$(curl -fsS -X POST \
          -H "Authorization: Bearer ${{ inputs.coolify_api_token }}" \
          "$DEPLOY_URL")

        echo "Coolify response: $RESPONSE"
        echo "Deployment successfully queued in Coolify."
